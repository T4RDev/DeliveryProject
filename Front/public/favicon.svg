<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FB923C"/>
      <stop offset="100%" stop-color="#EA580C"/>
    </linearGradient>
  </defs>
  
  <!-- Background: Rounded Orange Square -->
  <rect width="64" height="64" rx="16" fill="url(#bgGrad)"/>

  <!-- Speed / Motion Lines behind -->
  <path d="M5 23 h6 M4 28 h5 M6 33 h6" stroke="#FED7AA" stroke-width="2.5" stroke-linecap="round"/>

  <!-- Delivery Scooter and Rider -->
  <g fill="#FFFFFF">
    <!-- Back Wheel -->
    <circle cx="21" cy="45" r="6" fill="none" stroke="#FFFFFF" stroke-width="3.5"/>
    <circle cx="21" cy="45" r="2" fill="#FFFFFF"/>

    <!-- Front Wheel -->
    <circle cx="46" cy="45" r="6" fill="none" stroke="#FFFFFF" stroke-width="3.5"/>
    <circle cx="46" cy="45" r="2" fill="#FFFFFF"/>

    <!-- Scooter Frame / Footrest -->
    <path d="M21 45 h13 l7-16 h-7" fill="none" stroke="#FFFFFF" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>

    <!-- Handlebar & Front Fork -->
    <path d="M46 45 l-4-19 h-5" fill="none" stroke="#FFFFFF" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>

    <!-- Headlight beam -->
    <circle cx="46" cy="26" r="2" fill="#FEF08A"/>

    <!-- Delivery Box on the back rack -->
    <rect x="13" y="20" width="15" height="14" rx="3" fill="#FFFFFF"/>
    <line x1="13" y1="26" x2="28" y2="26" stroke="#EA580C" stroke-width="1.8"/>

    <!-- Rider Helmet -->
    <circle cx="33" cy="19" r="5" fill="#FFFFFF"/>
    <!-- Rider body / arm leaning forward -->
    <path d="M30 24 l4 5 l5 -3" fill="none" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
</svg>
