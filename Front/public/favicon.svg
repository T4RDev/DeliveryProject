<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FB923C"/>
      <stop offset="100%" stop-color="#EA580C"/>
    </linearGradient>
  </defs>
  <!-- Background rounded squircle -->
  <rect width="64" height="64" rx="16" fill="url(#bgGrad)"/>

  <!-- Speed Motion Lines -->
  <path d="M6 24 h5 M4 30 h6 M7 36 h4" stroke="#FED7AA" stroke-width="2.5" stroke-linecap="round"/>

  <!-- Delivery Scooter -->
  <g fill="#FFFFFF">
    <!-- Back wheel -->
    <circle cx="21" cy="46" r="6" fill="none" stroke="#FFFFFF" stroke-width="3.5"/>
    <circle cx="21" cy="46" r="2" fill="#FFFFFF"/>

    <!-- Front wheel -->
    <circle cx="47" cy="46" r="6" fill="none" stroke="#FFFFFF" stroke-width="3.5"/>
    <circle cx="47" cy="46" r="2" fill="#FFFFFF"/>

    <!-- Scooter Chassis & Footrest -->
    <path d="M21 46 h13 l7-16 h-7" fill="none" stroke="#FFFFFF" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>

    <!-- Front Handlebars -->
    <path d="M47 46 l-4-19 h-5" fill="none" stroke="#FFFFFF" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>

    <!-- Headlight glow -->
    <circle cx="47" cy="27" r="2" fill="#FEF08A"/>

    <!-- Delivery Box on rear rack -->
    <rect x="13" y="21" width="15" height="14" rx="3" fill="#FFFFFF"/>
    <!-- Box Detail Line -->
    <line x1="13" y1="27" x2="28" y2="27" stroke="#EA580C" stroke-width="1.8"/>
    <!-- Lunchbox handle on top -->
    <path d="M18 21 v-3 c0-1 1-1.5 2.5-1.5 h1 c1.5 0 2.5 0.5 2.5 1.5 v3" fill="none" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round"/>
  </g>
</svg>
